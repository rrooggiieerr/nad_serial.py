[build-system]
requires = ["hatchling>=1.29", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.vcs]
version-file = "nad_serial/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = [
    "official_documentation",
    ".github",
    ".settings",
    ".project",
    ".pydevproject",
]

[project]
name = "nad_serial"
dynamic = ["version"]
license = "Apache-2.0"
authors = [
    { name="Rogier van Staveren", email="rogier@batoid.com" }
]
description = "Library to control NAD amplifiers, tuners and receivers over serial (RS-232) or Ethernet (telnet)."
readme = "README.md"
requires-python = ">=3.13"
keywords = [
    "amplifier",
    "nad",
    "receiver",
    "rs232",
    "serial",
    "telnet",
    "tuner",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "serialx>=1.10.0"
]

[project.urls]
Homepage = "https://github.com/rrooggiieerr/nad_serial.py"
Repository = "https://github.com/rrooggiieerr/nad_serial.py"
Documentation = "https://github.com/rrooggiieerr/nad_serial.py#readme"
Issues = "https://github.com/rrooggiieerr/nad_serial.py/issues"
Changelog = "https://github.com/rrooggiieerr/nad_serial.py/releases"
Funding = "https://github.com/sponsors/rrooggiieerr"

[tool.ruff]
# https://docs.astral.sh/ruff/settings/
# Formats like black (line length 88) and sorts imports like isort.
target-version = "py313"
extend-exclude = ["nad_serial/_version.py"]

[tool.ruff.lint]
# Following Home Assistant Core rules
select = [
  "ASYNC", "B", "BLE", "C", "D", "E", "F", "FLY", "FURB", "G", "I", "ISC",
  "LOG", "PERF", "PIE", "PL", "PT", "RET", "RSE", "RUF", "SIM", "SLF",
  "T20", "TRY", "UP", "W",
]
ignore = [
  "D202", "D203", "D213", "E501", "PLR0911", "PLR0912", "PLR0913",
  "PLR0915", "PLR2004", "TRY003", "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "SLF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.pylint]
ignore = "_version.py"
recursive = "y"

[tool.mypy]
python_version = "3.13"
packages = ["nad_serial"]

[[tool.mypy.overrides]]
module = ["serialx.*", "*._version"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Import nad_serial from the project without installing it first.
pythonpath = ["."]
testpaths = ["tests"]

[tool.codespell]
skip = "*.pdf"
ignore-regex = 'EdgeEnhancement\.Treshold'
